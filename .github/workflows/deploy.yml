name: Deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _public
          cp -a index.html 404.html favicon.svg robots.txt .nojekyll css js publications more-about-me news cv _public/
          mkdir -p _public/assets _public/_bibliography
          cp -a assets/img assets/pdf _public/assets/
          cp -a _bibliography/papers.bib _public/_bibliography/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
